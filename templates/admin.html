{% extends "layout.html" %}
{% block title %}BingoPDYP - Admin{% endblock %}

{% block content %}
<section id="admin-view">

    <h2>Panel de Administración</h2>

    <!-- ========================= -->
    <!-- BOTONES PRINCIPALES       -->
    <!-- ========================= -->
    <div class="admin-buttons">
        <button id="start-game-btn">Iniciar Juego</button>
        <button id="reset-game-btn" class="danger">Reiniciar Juego</button>
    </div>

    <!-- ========================= -->
    <!-- ESTADO DEL JUEGO          -->
    <!-- ========================= -->
    <h3>Estado del Juego</h3>
    <div id="admin-game-status">En espera…</div>

    <!-- ========================= -->
    <!-- ÚLTIMA BALOTA              -->
    <!-- ========================= -->
    <h3>Última Balota</h3>
    <div id="admin-last-ball" class="admin-last-ball">-</div>

    <!-- ========================= -->
    <!-- JUGADORES CONECTADOS      -->
    <!-- ========================= -->
    <h3>Jugadores Conectados</h3>
    <p id="admin-player-count">0 jugadores</p>

</section>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>

{% endblock %}
