{% extends "layout.html" %}
{% block title %}BingoPDYP - Jugador{% endblock %}

{% block content %}
<section id="player-view">

    <h2>Tu Cartón</h2>

    <!-- CONTENEDOR PRINCIPAL: CARTÓN IZQUIERDA + TABLERO GENERAL DERECHA -->
    <div class="player-top">

        <!-- ========================= -->
        <!-- CARTÓN DEL JUGADOR        -->
        <!-- ========================= -->
        <div class="player-left">

            <p id="player-name" class="player-name"></p>

            <div id="card-container" class="card-wrapper">

                <!-- Encabezado B I N G O -->
                <div class="card-header-row">
                    <div class="cell header">B</div>
                    <div class="cell header">I</div>
                    <div class="cell header">N</div>
                    <div class="cell header">G</div>
                    <div class="cell header">O</div>
                </div>

                <!-- Aquí JS dibuja las 25 casillas -->
                <div id="card-grid" class="card-grid"></div>
            </div>

        </div>

        <!-- ========================= -->
        <!-- TABLERO GENERAL 1–75      -->
        <!-- ========================= -->
        <div class="player-right">

            <h3>Tablero General</h3>
            <p class="global-hint">Los números salientes se marcarán aquí.</p>

            <div id="global-board" class="global-board">
                <div class="global-columns">

                    <div class="global-column" id="global-col-B">
                        <div class="global-header">B</div>
                    </div>

                    <div class="global-column" id="global-col-I">
                        <div class="global-header">I</div>
                    </div>

                    <div class="global-column" id="global-col-N">
                        <div class="global-header">N</div>
                    </div>

                    <div class="global-column" id="global-col-G">
                        <div class="global-header">G</div>
                    </div>

                    <div class="global-column" id="global-col-O">
                        <div class="global-header">O</div>
                    </div>

                </div>
            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- BALOTA ACTUAL GRANDE      -->
    <!-- ========================= -->
    <h3>Última Balota</h3>

    <div id="last-ball-wrapper" class="last-ball-wrapper">
        <div class="ball-display">
            <div id="last-ball" class="bingo-ball">-</div>
        </div>
    </div>

    <!-- ========================= -->
    <!-- ESTADO DEL JUEGO          -->
    <!-- ========================= -->
    <h3>Estado del Juego</h3>
    <div id="bingo-status">En espera…</div>

</section>

<script src="{{ url_for('static', filename='js/client.js') }}"></script>

{% endblock %}
